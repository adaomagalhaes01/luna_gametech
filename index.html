<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <meta name="description"
        content="Jornada da Coelha: O Segredo das Cenouras - Um jogo de plataforma 2D com a coelha Luna em Cenouralândia">
    <meta name="theme-color" content="#4a9e3f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Jornada da Coelha: O Segredo das Cenouras</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link

    <script src="src/systems/SoundManager.js"></script>

    <script src="src/systems/EnemyAI.js"></script>
    <script src="src/systems/CombatSystem.js"></script>
    <script src="src/systems/CollisionSystem.js"></script>
    <script src="src/systems/HUD.js"></script>

    <script src="src/scenes/BootScene.js"></script>
    <script src="src/scenes/MenuScene.js"></script>
    <script src="src/scenes/CharacterSelectScene.js"></script>
    <script src="src/scenes/GameScene.js"></script>
    <script src="src/scenes/UIScene.js"></script>

    <script src="src/main.js"></script>
